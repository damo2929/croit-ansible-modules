---
- name: Pool info integration tests
  module_defaults:
    group/croit.ceph.all:
      api_url: "{{ croit_api_url }}"
      api_token: "{{ croit_api_token }}"
      validate_certs: "{{ croit_validate_certs | default(true) }}"
  block:
    - name: All pools (check mode)
      croit.ceph.pool_info:
      check_mode: true
      register: r
    - name: Assert pools
      ansible.builtin.assert:
        that: [r is not changed, r.pools is sequence]
    - name: Unknown pool
      croit.ceph.pool_info:
        name: "{{ croit_test_prefix | default('ansible-test') }}-does-not-exist"
      register: r
    - name: Assert unknown pool is empty
      ansible.builtin.assert:
        that: [r.pools | length == 0]
