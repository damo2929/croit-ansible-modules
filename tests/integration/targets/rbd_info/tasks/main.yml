---
- name: RBD info integration tests
  module_defaults:
    group/croit.ceph.all:
      api_url: "{{ croit_api_url }}"
      api_token: "{{ croit_api_token }}"
      validate_certs: "{{ croit_validate_certs | default(true) }}"
  block:
    - name: Image names (check mode)
      croit.ceph.rbd_info:
        details: false
      check_mode: true
      register: r
    - name: Assert image names
      ansible.builtin.assert:
        that: [r is not changed, r.images is sequence]
