---
# Only reversible changes: the notes of one interface of the lab server are changed and restored.
- name: Server NIC integration tests
  module_defaults:
    group/croit.ceph.all:
      api_url: "{{ croit_api_url }}"
      api_token: "{{ croit_api_token }}"
      validate_certs: "{{ croit_validate_certs | default(true) }}"
  vars:
    test_notes: "{{ croit_test_prefix | default('ansible-test') }} nic notes"
  block:
    - name: Read the lab server's interfaces
      croit.ceph.server_info:
        servers: ["{{ croit_test_server }}"]
        include_nics: true
      register: info

    - name: Pick an interface
      ansible.builtin.set_fact:
        test_nic: "{{ info.servers[0].nics[0] }}"

    - name: Set notes (check mode)
      croit.ceph.server_nic:
        server: "{{ croit_test_server }}"
        nic: "{{ test_nic.mac }}"
        notes: "{{ test_notes }}"
      check_mode: true
      register: r
    - name: Assert set notes (check mode)
      ansible.builtin.assert:
        that: [r is changed, (r.nic.notes | default('', true)) == (test_nic.notes | default('', true))]

    - name: Set notes
      croit.ceph.server_nic:
        server: "{{ croit_test_server }}"
        nic: "{{ test_nic.mac }}"
        notes: "{{ test_notes }}"
      register: r
    - name: Assert set notes
      ansible.builtin.assert:
        that: [r is changed, r.nic.notes == test_notes]

    - name: Set notes again
      croit.ceph.server_nic:
        server: "{{ croit_test_server }}"
        nic: "{{ test_nic.mac }}"
        notes: "{{ test_notes }}"
      register: r
    - name: Assert set notes again is a no-op
      ansible.builtin.assert:
        that: [r is not changed]

    - name: Delete without confirmation
      croit.ceph.server_nic:
        server: "{{ croit_test_server }}"
        nic: "{{ test_nic.mac }}"
        state: absent
      register: r
      ignore_errors: true
    - name: Assert delete without confirmation fails
      ansible.builtin.assert:
        that: [r is failed]

  always:
    - name: Restore notes
      croit.ceph.server_nic:
        server: "{{ croit_test_server }}"
        nic: "{{ test_nic.mac }}"
        notes: "{{ test_nic.notes | default('', true) }}"
      when: test_nic is defined
